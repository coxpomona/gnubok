name: Deploy to Vercel

# Vercel's Hobby build container has 8 GB and the Turbopack build is killed
# (SIGKILL, OOM) there. Public-repo GitHub runners have 16 GB, so the app is
# built here and the finished output is uploaded to Vercel. Environment
# variables still live in Vercel and are pulled at build time.
#
# The build output has more than 15 000 files, which is over Vercel's per-upload
# file limit, so it is uploaded as one tgz archive.
#
# Needs repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings and environment
        run: npx --yes vercel@latest pull --yes --environment=production

      - name: Build
        run: npx --yes vercel@latest build --prod

      - name: Deploy prebuilt output
        run: npx --yes vercel@latest deploy --prebuilt --archive=tgz --prod
